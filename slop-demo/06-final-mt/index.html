<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomBook: meeting room booking</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="changes.css"><!-- presenter overlay -->
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Navigation -->
  <header>
    <nav class="navbar" aria-label="Main">
      <a class="nav-logo" href="#main">RoomBook</a>
      <div class="nav-links">
        <a class="nav-link" href="#rooms">Rooms</a>
        <a class="nav-link" href="#book">Book</a>
        <a class="nav-link" href="#my-bookings">My bookings</a>
        <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-label="Switch to dark theme" title="Switch to dark theme">
          <svg class="icon icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <a class="btn btn-primary btn-sm nav-cta" href="#book">Book a room</a>
      </div>
    </nav>
  </header>

  <main id="main">

  <!-- Hero Section -->
  <section class="hero">
    <h1 class="hero-title">Book a meeting room</h1>
    <div class="hero-actions">
      <a class="btn btn-primary" href="#book">Book a room</a>
      <a class="btn btn-secondary" href="#rooms">See all rooms</a>
    </div>
    <p id="welcome-banner" class="welcome-banner"></p>
  </section>

  <!-- Rooms Section -->
  <section id="rooms" class="rooms-section">
    <h2 class="section-title">Rooms</h2>

    <div class="filter-bar">
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <label class="visually-hidden" for="room-search">Search rooms</label>
        <input type="search" id="room-search" class="search-input" placeholder="Search rooms">
      </div>
      <div class="filter-group" role="group" aria-label="Filter rooms">
        <button type="button" class="filter-chip" data-filter="all" aria-pressed="true" onclick="filterRooms('all')">All rooms</button>
        <button type="button" class="filter-chip" data-filter="available" aria-pressed="false" onclick="filterRooms('available')">Available now</button>
        <button type="button" class="filter-chip" data-filter="large" aria-pressed="false" onclick="filterRooms('large')">8+ people</button>
      </div>
    </div>

    <div id="rooms-grid" class="rooms-grid" aria-live="polite"></div>
  </section>

  <!-- Booking Form -->
  <section id="book" class="booking-section">
    <div class="booking-wrapper">
      <h2 class="section-title">Book a room</h2>

      <div class="form-card">
        <div class="form-card-inner">
          <div class="form-row">
            <label class="form-label" for="booking-room">Room</label>
            <select id="booking-room" class="form-input" required></select>
          </div>
          <div class="form-row">
            <label class="form-label" for="booking-title">Meeting title</label>
            <input type="text" id="booking-title" class="form-input" required>
          </div>
          <div class="form-row form-row-split">
            <div>
              <label class="form-label" for="booking-date">Date</label>
              <input type="date" id="booking-date" class="form-input" required>
            </div>
            <div>
              <label class="form-label" for="booking-start">Start</label>
              <select id="booking-start" class="form-input" required></select>
            </div>
            <div>
              <label class="form-label" for="booking-end">End</label>
              <select id="booking-end" class="form-input" required></select>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label" for="booking-attendees">Attendees</label>
            <input type="number" id="booking-attendees" class="form-input" min="1" inputmode="numeric">
          </div>
          <div class="form-row">
            <label class="form-label" for="booking-name">Your name</label>
            <input type="text" id="booking-name" class="form-input" autocomplete="name">
          </div>
          <div id="booking-message" class="booking-message" role="status" aria-live="polite"></div>
          <button type="button" class="btn btn-primary btn-block" onclick="handleBookingSubmit()">Book room</button>
        </div>
      </div>
    </div>
  </section>

  <!-- My Bookings -->
  <section id="my-bookings" class="my-bookings-section">
    <h2 class="section-title">My bookings</h2>
    <div id="my-bookings-list" class="my-bookings-list"></div>
  </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p class="footer-bottom">RoomBook, internal meeting-room booking</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <!-- presenter overlay, not part of the app -->
  <script src="changes.data.js"></script>
  <script src="changes.js"></script>
</body>
</html>
